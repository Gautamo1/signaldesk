services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: signaldesk
      POSTGRES_PASSWORD: signaldesk
      POSTGRES_DB: signaldesk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signaldesk"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
