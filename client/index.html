<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SignalDesk — Research Operations</title>
    <meta name="description" content="SignalDesk: monitor sources, triage evidence, produce research briefs." />
    <script>
      // Apply the persisted theme before first paint to avoid a flash.
      // SignalDesk is dark-first: default is dark unless the user chose light.
      try {
        var t = localStorage.getItem('sd:theme')
        if (t !== 'light' && t !== 'dark') t = 'dark'
        document.documentElement.dataset.theme = t
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
